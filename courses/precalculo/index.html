    <script>
        /* Sesiones del curso. Las semanas de examen no tienen PDF: file = null. */
        (function () {
            var SESSIONS = [
                { week: 1,  file: "Semana-01.pdf",
                  es: "Presentación del curso · Conjuntos numéricos y sus propiedades",
                  en: "Course introduction · Number sets and their properties" },
                { week: 2,  file: "Semana-02.pdf",
                  es: "Operaciones básicas con números enteros",
                  en: "Basic operations with integers" },
                { week: 3,  file: "Semana-03.pdf",
                  es: "Operaciones básicas con números racionales",
                  en: "Basic operations with rational numbers" },
                { week: 4,  file: "Semana-04.pdf",
                  es: "Conjuntos: operaciones y diagramas de Venn",
                  en: "Sets: operations and Venn diagrams" },
                { week: 5,  file: "Semana-05.pdf",
                  es: "Razones y proporciones · Repaso de la Unidad 1",
                  en: "Ratios and proportions · Unit 1 review" },
                { week: 6,  file: null,
                  es: "Examen 1 (35 %) — Unidad 1",
                  en: "Exam 1 (35 %) — Unit 1" },
                { week: 7,  file: "Semana-07.pdf",
                  es: "Potencias y sus propiedades",
                  en: "Powers and their properties" },
                { week: 8,  file: "Semana-08.pdf",
                  es: "Radicación y sus propiedades",
                  en: "Radicals and their properties" },
                { week: 9,  file: "Semana-09.pdf",
                  es: "Racionalización y sus procesos",
                  en: "Rationalizing denominators" },
                { week: 10, file: "Semana-10.pdf",
                  es: "Logaritmos",
                  en: "Logarithms" },
                { week: 11, file: "Semana-11.pdf",
                  es: "Propiedades de los logaritmos · Repaso de la Unidad 2",
                  en: "Properties of logarithms · Unit 2 review" },
                { week: 12, file: null,
                  es: "Examen 2 (35 %) — Unidad 2",
                  en: "Exam 2 (35 %) — Unit 2" },
                { week: 13, file: "Semana-13.pdf",
                  es: "Operaciones algebraicas · Productos notables",
                  en: "Algebraic operations · Special products" },
                { week: 14, file: "Semana-14.pdf",
                  es: "Factorización",
                  en: "Factoring" },
                { week: 15, file: "Semana-15.pdf",
                  es: "Fracciones algebraicas · Funciones trigonométricas",
                  en: "Algebraic fractions · Trigonometric functions" },
                { week: 16, file: null,
                  es: "Examen 3 (30 %) — Unidad 3",
                  en: "Exam 3 (30 %) — Unit 3" }
            ];

            var container = document.getElementById("course-files");

            function render() {
                var lang = (window.I18N && window.I18N.lang) || "es";
                var weekLabel = (window.I18N && window.I18N.t("course.week")) || "Week";
                var examLabel = (window.I18N && window.I18N.t("course.examWeek")) || "Exam week";
                var html = "";

                SESSIONS.forEach(function (s) {
                    var title = s[lang] || s.es;
                    if (s.file) {
                        html +=
                            '<a class="file-row" href="Archivos/' + s.file + '" ' +
                            'target="_blank" rel="noopener">' +
                            '<span class="file-tag">PDF</span>' +
                            "<span><strong>" + weekLabel + " " + s.week + "</strong> — " +
                            title + "</span></a>";
                    } else {
                        html +=
                            '<div class="file-row" aria-disabled="true" ' +
                            'style="opacity:.6;cursor:default">' +
                            '<span class="file-tag">' + examLabel + "</span>" +
                            "<span><strong>" + weekLabel + " " + s.week + "</strong> — " +
                            title + "</span></div>";
                    }
                });

                container.innerHTML = html;
            }

            document.addEventListener("DOMContentLoaded", render);
            document.addEventListener("afp:languagechange", render);
        })();
    </script>
